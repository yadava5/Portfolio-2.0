# Comprehensive CI/CD Pipeline
# Runs on every push to main and on all pull requests
#
# Test Matrix:
#   ┌──────────────────────────────────────────────────────────────────┐
#   │  Stage 1: Quality Checks (parallel)                              │
#   │  ┌─────────────┐ ┌─────────────┐ ┌─────────────┐ ┌─────────────┐ │
#   │  │   Format    │ │   ESLint    │ │  TypeScript │ │  Security   │ │
#   │  │  (Prettier) │ │ (Code Qual) │ │ (Type Check)│ │  (npm audit)│ │
#   │  └──────┬──────┘ └──────┬──────┘ └──────┬──────┘ └──────┬──────┘ │
#   └─────────┼───────────────┼───────────────┼───────────────┼────────┘
#             │               │               │               │
#             └───────────────┴───────┬───────┴───────────────┘
#                                     ▼
#   ┌──────────────────────────────────────────────────────────────────┐
#   │  Stage 2: Build & Analyze                                        │
#   │  ┌─────────────────────────┐ ┌─────────────────────────────────┐ │
#   │  │     Production Build    │ │         Shipped Weight          │ │
#   │  │     (static export)     │ │  (what a reader downloads, out/)│ │
#   │  └─────────────────────────┘ └─────────────────────────────────┘ │
#   └──────────────────────────────────────────────────────────────────┘

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # STAGE 1: Quality Checks (run in parallel)
  # ═══════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────
  # Format: Check code formatting with Prettier
  # ─────────────────────────────────────────────────────────────
  format:
    name: 🎨 Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          echo "🔍 Checking code formatting with Prettier..."
          npm run format:check
          echo "✅ All files are properly formatted!"

  # ─────────────────────────────────────────────────────────────
  # ESLint: Check code quality and best practices
  # ─────────────────────────────────────────────────────────────
  eslint:
    name: 🔍 ESLint (Code Quality)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          echo "🔍 Checking code quality with ESLint..."
          npm run lint
          echo "✅ No ESLint errors found!"

  # ─────────────────────────────────────────────────────────────
  # TypeScript: Verify type safety
  # ─────────────────────────────────────────────────────────────
  typecheck:
    name: 📝 TypeScript (Type Safety)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: |
          echo "🔍 Checking TypeScript types..."
          npm run typecheck
          echo "✅ No type errors found!"

  # ─────────────────────────────────────────────────────────────
  # Security: Check for vulnerabilities in dependencies
  # ─────────────────────────────────────────────────────────────
  security:
    name: 🔒 Security (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: |
          echo "🔍 Checking for security vulnerabilities..."
          npm audit --audit-level=high || echo "⚠️ Some vulnerabilities found (non-blocking)"
          echo "✅ Security check complete!"
        # Note: Using || echo to not fail on moderate vulnerabilities
        # Change to just `npm audit --audit-level=moderate` to be stricter

  # ═══════════════════════════════════════════════════════════════════
  # STAGE 2: Build & Analyze (runs after Stage 1 passes)
  # ═══════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────
  # Build: Production build verification
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build (static export)
    runs-on: ubuntu-latest
    needs: [format, eslint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "🏗️ Building the static export..."
          npm run build
          echo "✅ Production build successful!"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # Portfolio: the run IS the home page, and it still is
  #
  # The gates in this repo were good individually and never assembled. Two
  # things this job exists to fix, both measured rather than supposed:
  #
  #   · NOTHING asserted that out/index.html is the run. It is the whole
  #     portfolio. check-static-export-seo reads the file but only for
  #     canonical/og/JSON-LD — which build-home.mjs LIFTS from Next's own
  #     render — so it passed identically whether the 13-station run or the
  #     abandoned 7-chapter React port shipped.
  #   · The run's closure is invisible to every gate. Delete src/run/wasm/
  #     and out/index.html is byte-identical, all of CI is green, and fig
  #     06's classifier 404s in production. The run fetches those files at
  #     runtime by relative path, so its own bytes never change.
  #
  # Runs the deploy configuration (NODE_ENV=production, the real basePath),
  # because a hash of any other build certifies an artifact nobody deploys.
  # deploy.yml gates on build + test:seo + test:proof only; this is the job
  # that gates on the portfolio actually being there.
  # ─────────────────────────────────────────────────────────────
  verify-portfolio:
    name: 🚂 Portfolio Validator
    runs-on: ubuntu-latest
    needs: [format, eslint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Not piped into anything. A pipe eats the exit code, and that hid a
      # red Prettier gate here for twelve CI runs.
      - name: Verify the portfolio
        run: npm run verify:portfolio

  # ─────────────────────────────────────────────────────────────
  # Resume: Verify public resume remains parseable and one page
  # ─────────────────────────────────────────────────────────────
  resume-check:
    name: 📄 Resume Parser Check
    runs-on: ubuntu-latest
    needs: [format, eslint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Check resume
        run: npm run resume:check

  # ─────────────────────────────────────────────────────────────
  # Static SEO: Verify GitHub Pages export metadata and routes
  # ─────────────────────────────────────────────────────────────
  static-seo:
    name: 🔎 Static SEO Export
    runs-on: ubuntu-latest
    needs: [format, eslint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production static export
        run: NODE_ENV=production NEXT_PUBLIC_BASE_PATH=/Portfolio-2.0 npm run build

      - name: Check static SEO metadata
        run: npm run test:seo

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser metadata smoke
        run: NEXT_PUBLIC_BASE_PATH=/Portfolio-2.0 npx playwright test tests/playwright/static-seo.spec.ts

      # The nameplate gates live here rather than in proof-manifest because they
      # have two preconditions and this is the only job that meets both: they
      # serve `out/` — so the static export must already be built — and they
      # launch chromium. proof-manifest does neither, which is why placing them
      # there produced a null `[data-nameplate] h1` against an empty directory.
      - name: Check nameplate invariants
        run: npm run test:nameplate

      - name: Check nameplate negative cases
        run: npm run test:nameplate:negative

  # ─────────────────────────────────────────────────────────────
  # Proof: Verify public metrics have source-truth coverage
  # ─────────────────────────────────────────────────────────────
  proof-manifest:
    name: 🧾 Proof Manifest
    runs-on: ubuntu-latest
    needs: [format, eslint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check proof coverage
        run: npm run test:proof

      # `test:contrast` stood here and was retired in Phase 4. It mirrored a
      # palette from src/app/globals.css by hand; measured before deleting, 3
      # of its 21 colours still appear in src/run/index.html and the clay it
      # spent most of its assertions on appears nowhere on the site. Its
      # replacement reads the two stylesheets that actually ship, over the
      # run's own OKLCH arc, through the page's own converter — and enforces
      # the rule that killed it: a contrast number written in a comment is
      # recomputed, so a palette table nothing binds cannot come back.
      - name: Check the palette against the light it is read under
        run: npm run test:palette

      - name: Check og cards (rendered footer URL casing + freshness)
        run: npm run assets:check-og

      # These four existed and had never run on a pull request. The
      # 2026-08-02 provenance audit is what surfaced it: check-figures.mjs
      # was written in July specifically to stop the run and the data layer
      # drifting apart, and while it sat outside CI they drifted anyway —
      # /evidence shipped 1,145 tests for two days after the receipt beside
      # it had been corrected to 1,168. A gate that does not run is a
      # comment. It now binds 18 figures instead of 7.
      - name: Check headline figures (run prose ⇄ data layer)
        run: npm run test:figures

      - name: Check beat tables (every beat-indexed table agrees)
        run: npm run test:beat-tables

      # src/lib/data/stations.ts restates thirteen stops of a hand-authored
      # page, so something has to bind it or it is a second head. It replaced
      # the arrangement that put those five dead anchors on nine routes: a
      # seven-chapter React contract, bridged to the run by a rename map. Runs
      # BEFORE the anchors step, which resolves the 404's index through it —
      # this one names drift, that one would only report its symptom.
      - name: Check stations agree with the run, verbatim
        run: npm run test:stations

      # `test:anchors` stood here: every /#... link into the home page must
      # land on something, after five were found dead on nine indexable routes
      # on 2026-08-02 (a hash that matches nothing scrolls to the top and
      # raises no error). It read the five REACT files that wrote such links,
      # and Phase 4 deletes all five. check-crosswalk.mjs's fifth direction
      # asks the same question of the generated pages instead — the 404's
      # wayfinding index included — and runs inside verify:portfolio.
      #
      # The comment here also used to blame the browser suite for building
      # "the OTHER home page (bare `next build`, no build-home.mjs)", which
      # was already FALSE when it was written: every test:e2e:* script had run
      # build-home.mjs for weeks, and what differed was the basePath. Recorded
      # rather than quietly dropped, because it sent at least one triage to
      # the wrong file.

      # Runs in the job that has already built `out/`. The 2026-08-02 audit
      # shipped two pinned links to UNPUSHED local commits — correct numbers,
      # measured on trees that did not exist publicly, so /evidence 404'd.
      # No offline check can find that: the label and the link agreed, and
      # both named a commit that was not there. Only a request finds it.
      - name: Check pinned artifact links resolve
        run: npm run test:links

      # The nameplate checks used to sit here and could not work: they serve
      # `out/` and launch chromium, and this job neither builds nor installs a
      # browser. They now live in static-seo, which does both.

  # ─────────────────────────────────────────────────────────────
  # Browser Quality: Playwright smoke, reduced motion, performance
  # ─────────────────────────────────────────────────────────────
  browser-quality:
    name: 🎭 Browser Quality Gates
    runs-on: ubuntu-latest
    needs: [format, eslint, typecheck]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Check asset budgets
        run: npm run assets:budget

      - name: Run browser smoke
        run: npm run test:e2e:browser-smoke

      - name: Run reduced-motion checks
        run: npm run test:e2e:reduced-motion

      # KEPT THROUGH PHASE 4 AND WIRED INTO CI FOR THE FIRST TIME. axe is the
      # only automated accessibility coverage this repository has, and Phase 4
      # replaced every case-file DOM in the site — a rebuild is when you want
      # the check, not when you want to lose it. It also asserts the archive's
      # skip link, which exists because scripts/archive/html.mjs writes it and
      # which no other gate reads.
      - name: Run accessibility audit
        run: npm run test:e2e:a11y

      - name: Run performance checks
        run: npm run test:e2e:performance

      # THE PROBE APPARATUS RETIRED WITH `next build`, 2026-08-06. Two steps
      # stood here: a leak check asserting no probe route reached out/, and a
      # probe-gated suite that deliberately built one that did. Both existed
      # only because `pageExtensions` in next.config.ts could admit a route
      # file by extension — that is a Next mechanism, and nothing in the
      # static generator can create a route nobody asked for. The owner's
      # ruling was "retire the probe, keep the render": the HELD stamp still
      # renders on any receipt that needs holding, and there are zero live
      # rows to hold today, which is why the fixture existed at all.

  # ─────────────────────────────────────────────────────────────
  # Bundle Analysis: Track bundle sizes
  # ─────────────────────────────────────────────────────────────
  bundle-analysis:
    name: 📦 Shipped Weight
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # REPOINTED AT WHAT SHIPS, 2026-08-06. Every line of this used to read
      # `.next/static` — the bundler's output directory, which no longer
      # exists. With `|| echo "(not available)"` on each one it would have
      # printed three shrugs and gone green forever, which is the shape of a
      # report that has stopped reporting. The subject is better now anyway:
      # there is no bundle, so the question is what a reader downloads.
      - name: Build the site
        run: npm run build

      - name: Report what ships
        run: |
          echo "📦 What a reader downloads"
          echo "=========================="
          echo ""
          echo "the run (out/index.html) — one hand-authored page, no dependencies:"
          du -h out/index.html
          echo ""
          echo "the whole export:"
          du -sh out
          echo ""
          echo "the ten largest files:"
          find out -type f -exec du -h {} \; | sort -rh | head -10
          echo ""
          echo "javascript, all of it:"
          find out -name "*.js" -type f -exec du -h {} \; | sort -rh

  # ═══════════════════════════════════════════════════════════════════
  # Final Status Check
  # ═══════════════════════════════════════════════════════════════════
  ci-success:
    name: ✅ CI Complete
    runs-on: ubuntu-latest
    needs:
      [
        format,
        eslint,
        typecheck,
        security,
        build,
        verify-portfolio,
        resume-check,
        static-seo,
        proof-manifest,
        browser-quality,
        bundle-analysis,
      ]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "📊 CI Pipeline Summary"
          echo "======================"
          echo ""
          echo "Format:    ${{ needs.format.result }}"
          echo "ESLint:    ${{ needs.eslint.result }}"
          echo "TypeCheck: ${{ needs.typecheck.result }}"
          echo "Security:  ${{ needs.security.result }}"
          echo "Build:     ${{ needs.build.result }}"
          echo "Portfolio: ${{ needs.verify-portfolio.result }}"
          echo "Resume:    ${{ needs.resume-check.result }}"
          echo "StaticSEO: ${{ needs.static-seo.result }}"
          echo "Proof:     ${{ needs.proof-manifest.result }}"
          echo "Browser:   ${{ needs.browser-quality.result }}"
          echo "Bundle:    ${{ needs.bundle-analysis.result }}"
          echo ""
          
          if [[ "${{ needs.format.result }}" != "success" ]] || \
             [[ "${{ needs.eslint.result }}" != "success" ]] || \
             [[ "${{ needs.typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.verify-portfolio.result }}" != "success" ]] || \
             [[ "${{ needs.resume-check.result }}" != "success" ]] || \
             [[ "${{ needs.static-seo.result }}" != "success" ]] || \
             [[ "${{ needs.proof-manifest.result }}" != "success" ]] || \
             [[ "${{ needs.browser-quality.result }}" != "success" ]] || \
             [[ "${{ needs.bundle-analysis.result }}" != "success" ]]; then
            echo "❌ CI Pipeline FAILED"
            exit 1
          else
            echo "✅ CI Pipeline PASSED"
          fi
