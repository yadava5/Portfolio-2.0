# GitHub Pages deployment workflow
# Builds Next.js as static export and deploys to GitHub Pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # check-nameplate.mjs and check-cargo-fixture.mjs drive a real browser
      # against out/. Chromium only — the five-browser smoke is the one step
      # --no-e2e skips, and it is skipped for the reason below.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # THE DEPLOY USED TO SHIP PAST THE ONLY GATE THAT MATTERS.
      #
      # This job built, ran `test:seo` and `test:proof`, and uploaded. It does
      # not `needs:` anything in ci.yml — `needs:` does not reach across
      # workflow files — and it triggers independently on push to main. So a
      # red CI never blocked a deploy, and `assertRunShipped`, the one check
      # that asserts out/index.html IS the 13-station run rather than the
      # abandoned React port, ran nowhere on the path to production. That is
      # the migration's first invariant, unprotected at the one moment it
      # matters.
      #
      # verify:portfolio already IS the build: it runs `npm run build` itself
      # under exactly the configuration this job used to set inline
      # (NODE_ENV=production, NEXT_PUBLIC_BASE_PATH= — see
      # DEPLOY_ENV in the script), and `test:seo` and `test:proof` are two of
      # its nineteen steps. Replacing the three steps with the validator adds
      # sixteen gates and removes a second, divergent copy of the deploy env.
      #
      # --no-e2e IS LOAD-BEARING, NOT A SHORTCUT. The browser-smoke step
      # rebuilds and re-runs build-home.mjs, so out/ AFTERWARDS is a rebuild
      # rather than the artifact that was hashed — the script says so in its
      # own closing note. Every other step reads out/ without rewriting it,
      # so out/ at upload time is the deploy build. The five-browser smoke
      # stays in CI, where nothing is shipped from the tree it leaves behind.
      #
      # The gap this used to close is currently zero and the flag stays. When
      # the site was a project page the smoke rebuilt with an EMPTY base path
      # against a deploy that used /Portfolio-2.0, so running the full
      # validator here would have uploaded a build whose every asset URL was
      # wrong. On ayush-yadav.com the deploy base path is empty too, and the
      # two builds were measured byte-identical for index.html. That is two
      # settings coinciding, not an invariant — what is uploaded must not
      # depend on it, so the deploy still refuses to run the step that
      # rewrites what it is about to ship.
      - name: Build and verify the portfolio (deploy configuration)
        run: node scripts/qa/verify-portfolio.mjs --no-e2e

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
