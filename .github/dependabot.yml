version: 2

# The last repository in the estate without version updates. The distinction
# that made it easy to miss: Dependabot ALERTS were enabled here (the
# vulnerability-alerts API), which reports known CVEs but opens no PRs.
# Version updates are a different feature and need this file. The other five
# repos have carried one for weeks, covering 2-5 ecosystems each.
#
# One entry per ecosystem that actually exists in this tree. Dependabot
# silently ignores a directory with no manifest, so an over-broad config looks
# configured and updates nothing — each directory below was checked against a
# real manifest before it was written:
#
#   /          package.json + package-lock.json   (the whole build; there is
#              no second npm project — the only other package.json files are
#              under .build/, which is generated staging, not source)
#   actions    .github/workflows/{ci,deploy}.yml
#
# Monthly rather than weekly, matching the siblings: one maintainer, and a queue
# of PRs nobody can review is worse than a slightly older lockfile. The limits
# are deliberately small for the same reason — the estate was carrying 83 open
# Dependabot PRs when this was written, which is what an unbounded config buys.

updates:
  # ---- The portfolio build ------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    # Monthly, not weekly: this cadence governs VERSION updates only. Dependabot
    # SECURITY updates are a separate mechanism unaffected by `schedule`, so
    # vulnerability patches still arrive immediately.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      # Playwright's runner and its browser bindings have to move together;
      # split across PRs they produce a red suite that is nobody's fault.
      #
      # NO update-types filter, and that is the whole point. Every other group
      # here is minor/patch so majors stay individually reviewable — this one
      # is the documented exception, for the same reason github/codeql-action
      # is one below: a MAJOR is precisely when the runner and the bindings
      # must not be allowed to separate. Adding `update-types: [minor, patch]`
      # here reads like consistency and reintroduces the exact failure the two
      # lines above warn about. It was added and reverted on 2026-08-08.
      playwright:
        patterns:
          - "@playwright/*"
          - playwright
      # Lint and format tooling churns on its own schedule and is safe to
      # batch. A separate PR per ESLint plugin is pure review tax.
      lint-tooling:
        patterns:
          - eslint
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - prettier
        update-types:
          - minor
          - patch
      # The type system and the compiler move as one.
      typescript:
        patterns:
          - typescript
          - "@types/*"
        update-types:
          - minor
          - patch

  # ---- The workflows themselves -------------------------------------------
  # ci.yml and deploy.yml pin actions by tag (checkout@v4, setup-node@v4,
  # upload-artifact@v4, download-artifact@v4, upload-pages-artifact@v3,
  # deploy-pages@v4). download-artifact arrived with the 2026-08-07 link-gate
  # fix, so this entry has something to keep current from the day it lands.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      # If github/codeql-action is ever pinned here, its sub-actions (init,
      # analyze, autobuild, upload-sarif) are one action and MUST move in
      # lockstep. Bumping one alone hard-fails CodeQL:
      #   ##[error]Loaded a configuration file for version '4.36.2', but running version '4.37.6'
      # Dedicated group, NO update-types filter (every type, majors included),
      # listed BEFORE the catch-all because Dependabot assigns each dependency
      # to the FIRST matching group in order. No codeql action is pinned in
      # ci.yml/deploy.yml today, so this is a forward-looking safeguard.
      codeql-action:
        patterns:
          - "github/codeql-action*"
      # Everything else: one PR per monthly batch of minor/patch action bumps.
      # Majors stay individual because they need a human.
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
