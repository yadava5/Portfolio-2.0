<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">Master Inventory Proof Ledger</title>
  <desc id="desc">Sanitized source audit showing Tableau rows, Workday rows, deduped master rows, schema fields, tests, and privacy boundary</desc>
  <rect width="1376" height="768" fill="#020617"/>
  <rect x="32" y="32" width="1312" height="704" rx="28" fill="#07111f" stroke="#1f2937"/>
  <text x="72" y="106" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800" fill="#f8fafc">Master Inventory Proof Ledger</text>
  <text x="72" y="150" font-family="Inter, Arial, sans-serif" font-size="22" fill="#94a3b8">Sanitized local audit summary; no raw institutional rows, owners, report names, or PAT values.</text>
  <line x1="72" y1="188" x2="1304" y2="188" stroke="#1f2937"/>

  <g>
    <rect x="72" y="228" width="290" height="128" rx="18" fill="#031b16" stroke="#10b981" stroke-opacity="0.55"/>
    <text x="96" y="268" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#6ee7b7">TABLEAU OUTPUT</text>
    <text x="96" y="314" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">3,731</text>
    <text x="96" y="338" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">processed metadata rows</text>
  </g>

  <g>
    <rect x="392" y="228" width="290" height="128" rx="18" fill="#1c1604" stroke="#f59e0b" stroke-opacity="0.55"/>
    <text x="416" y="268" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24">WORKDAY OUTPUT</text>
    <text x="416" y="314" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">6,743</text>
    <text x="416" y="338" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">processed custom-report rows</text>
  </g>

  <g>
    <rect x="712" y="228" width="290" height="128" rx="18" fill="#04141f" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="736" y="268" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7dd3fc">MASTER CSV</text>
    <text x="736" y="314" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">10,453</text>
    <text x="736" y="338" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">deduped master rows</text>
  </g>

  <g>
    <rect x="1032" y="228" width="272" height="128" rx="18" fill="#111827" stroke="#64748b" stroke-opacity="0.7"/>
    <text x="1056" y="268" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#cbd5e1">SCHEMA</text>
    <text x="1056" y="314" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#f8fafc">35</text>
    <text x="1056" y="338" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">source fields defined</text>
  </g>

  <g>
    <rect x="72" y="404" width="1232" height="154" rx="18" fill="#030712" stroke="#1f2937"/>
    <text x="104" y="444" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#f59e0b">FLOW VERIFIED</text>
    <text x="104" y="492" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#e5e7eb">Tableau processed output</text>
    <path d="M 390 484 L 486 484" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 486 484 l -14 -8 l 0 16 z" fill="#f59e0b"/>
    <text x="522" y="492" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#e5e7eb">Workday processed output</text>
    <path d="M 820 484 L 916 484" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <path d="M 916 484 l -14 -8 l 0 16 z" fill="#f59e0b"/>
    <text x="952" y="492" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#e5e7eb">deduped master_inventory.csv</text>
    <text x="104" y="532" font-family="Inter, Arial, sans-serif" font-size="17" fill="#94a3b8">Deterministic inventory_id values, timestamped run folders, and cumulative processed outputs were audited by count only.</text>
  </g>

  <g>
    <rect x="72" y="594" width="384" height="82" rx="16" fill="#031b16" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="96" y="628" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#6ee7b7">LOCAL TESTS</text>
    <text x="96" y="656" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e5e7eb">pytest: 3 passed</text>
  </g>
  <g>
    <rect x="496" y="594" width="384" height="82" rx="16" fill="#031b16" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="520" y="628" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#6ee7b7">RUFF CHECK</text>
    <text x="520" y="656" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e5e7eb">E9, F63, F7, F82 passed</text>
  </g>
  <g>
    <rect x="920" y="594" width="384" height="82" rx="16" fill="#1c1604" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="944" y="628" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#fbbf24">PUBLIC BOUNDARY</text>
    <text x="944" y="656" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e5e7eb">counts and schema only</text>
  </g>
</svg>
